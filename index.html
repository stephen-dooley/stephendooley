        <style>
            /* Trailing dots after "producer" type themselves out and delete on a loop:
               0 -> 1 -> 2 -> 3 -> 2 -> 1 and back to 0. All three dots animate, so the
               run empties completely at the top of each cycle.
               The dots hold their space at all times and only toggle opacity, so the
               heading never reflows. Timing is discrete rather than eased, to read as
               keystrokes instead of a fade.
               Cycle is 5.125s: a 2s pause on empty, then five 625ms keystrokes
               (2000 + 5 x 625). The pause is 39.02% of the cycle, which is where the
               odd-looking keyframe percentages below come from. */
            .typing-dots > .dot {
                opacity: 0;
                animation: 5.125s steps(1, end) infinite;
            }
            .typing-dots > .dot-1 {
                animation-name: typing-dot-1;
            }
            .typing-dots > .dot-2 {
                animation-name: typing-dot-2;
            }
            .typing-dots > .dot-3 {
                animation-name: typing-dot-3;
            }

            /* Phase boundaries, as a fraction of the 5.125s cycle:
                 0      -> 39.02%   empty, the 2s pause
                 39.02% -> 51.22%   .
                 51.22% -> 63.41%   ..
                 63.41% -> 75.61%   ...
                 75.61% -> 87.80%   ..
                 87.80% -> 100%     .        then straight back to empty */
            @keyframes typing-dot-1 {
                0%, 38.9% { opacity: 0; }
                39.0%, 100% { opacity: 1; }
            }
            @keyframes typing-dot-2 {
                0%, 51.1% { opacity: 0; }
                51.2%, 87.7% { opacity: 1; }
                87.8%, 100% { opacity: 0; }
            }
            @keyframes typing-dot-3 {
                0%, 63.3% { opacity: 0; }
                63.4%, 75.5% { opacity: 1; }
                75.6%, 100% { opacity: 0; }
            }

            /* No motion: hold a single period so the sentence stays punctuated. */
            @media (prefers-reduced-motion: reduce) {
                .typing-dots > .dot {
                    animation: none;
                    opacity: 0;
                }
                .typing-dots > .dot-1 {
                    opacity: 1;
                }
            }
        </style>
    </head>
